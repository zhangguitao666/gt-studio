name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libpulse0 libasound2t64
      - name: Install project and test dependencies
        run: python -m pip install -e '.[test]'
      - name: Select bundled FFmpeg
        run: python -c 'import imageio_ffmpeg, os; open(os.environ["GITHUB_ENV"], "a").write("FRAMEFORGE_FFMPEG=" + imageio_ffmpeg.get_ffmpeg_exe() + "\n")'
      - name: Run tests
        run: python -m pytest -q --junitxml=test-output/results.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: test-output/results.xml
          if-no-files-found: ignore
