name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libpulse0 libasound2t64 fonts-dejavu-core
      - name: Install project and test dependencies
        run: python -m pip install -e '.[test]'
      - name: Verify pinned full-feature FFmpeg
        run: |
          python scripts/prepare_ci_ffmpeg.py
      - name: Run tests
        run: python -m pytest -vv --assert=plain -o faulthandler_timeout=60 --junitxml=test-output/results.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: test-output/results.xml
          if-no-files-found: ignore

  media_diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project
        run: python -m pip install -e .
      - name: Verify pinned full-feature FFmpeg
        run: python scripts/prepare_ci_ffmpeg.py
      - name: Probe native color differences
        run: python scripts/diagnose_native_media_levels.py --cases auto_b0 full_b0p75 --output test-output/native-color-diagnostics.json
      - name: Upload color diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-color-diagnostics
          path: test-output/native-color-diagnostics.json
          if-no-files-found: ignore
